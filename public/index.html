<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messenger – Realtime Chat</title>
  <meta name="description" content="Ứng dụng nhắn tin realtime xây dựng bằng Node.js, Express, Socket.IO." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<!-- ─────────────────── AUTH MODAL ─────────────────── -->
<div class="auth-overlay" id="authOverlay">
  <div class="auth-card">
    <div class="auth-header">
      <h2>💬 Messenger</h2>
      <p id="authSubtitle">Đăng nhập để bắt đầu trò chuyện</p>
    </div>

    <form class="auth-form" id="authForm">
      <!-- Register-only field -->
      <input type="text" id="inputName" placeholder="Tên hiển thị" style="display:none" />
      <input type="text" id="inputUsername" placeholder="Tên đăng nhập" autocomplete="username" required />
      <input type="password" id="inputPassword" placeholder="Mật khẩu" autocomplete="current-password" required />
      <div id="authError" style="color:#f87171;font-size:13px;margin-bottom:10px;display:none;"></div>
      <button class="btn-primary" type="submit" id="authSubmitBtn">Đăng nhập</button>
    </form>

    <p style="margin-top:14px;font-size:13px;color:#94a3b8;">
      <span id="authToggleText">Chưa có tài khoản?</span>
      <a href="#" id="authToggleLink" style="color:#3b82f6;font-weight:600;"> Đăng ký</a>
    </p>

    <div class="quick-login-box">
      <p>⚡ Đăng nhập nhanh tài khoản demo</p>
      <div class="quick-btn-group">
        <button class="quick-btn" onclick="quickLogin('tuandl','123456')">tuandl</button>
        <button class="quick-btn" onclick="quickLogin('minhth','123456')">minhth</button>
        <button class="quick-btn" onclick="quickLogin('lanhuong','123456')">lanhuong</button>
      </div>
    </div>
  </div>
</div>

<!-- ─────────────────── MAIN APP ─────────────────── -->
<div class="app-container" id="appContainer" style="display:none">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="user-profile-badge">
        <img class="user-avatar" id="myAvatar" src="" alt="avatar" />
        <div class="user-info">
          <h4 id="myName">—</h4>
          <span>● Trực tuyến</span>
        </div>
      </div>
      <div class="header-actions">
        <a class="icon-btn" href="/api-docs" target="_blank" title="API Docs">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg>
        </a>
        <button class="icon-btn" id="logoutBtn" title="Đăng xuất">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>

    <div class="search-container">
      <input class="search-input" id="searchInput" placeholder="🔍  Tìm hoặc bắt đầu cuộc trò chuyện…" />
    </div>

    <div class="conversation-list" id="conversationList">
      <p style="text-align:center;color:#475569;padding:24px;font-size:13px;">Đang tải danh sách…</p>
    </div>
  </aside>

  <!-- CHAT AREA -->
  <main class="chat-area">
    <!-- Default empty state -->
    <div class="empty-chat-state" id="emptyChatState">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
      </svg>
      <p style="font-size:16px;font-weight:600;margin-bottom:6px;">Chọn một cuộc trò chuyện</p>
      <p style="font-size:14px;color:#475569;">hoặc tìm kiếm người dùng để bắt đầu nhắn tin</p>
    </div>

    <!-- Active chat -->
    <div id="chatPanel" style="display:none;flex:1;display:flex;flex-direction:column;">
      <div class="chat-header">
        <div class="chat-header-user">
          <div class="avatar-wrapper">
            <img class="user-avatar" id="partnerAvatar" src="" alt="avatar" style="width:44px;height:44px;" />
            <span class="status-dot" id="partnerStatus"></span>
          </div>
          <div class="user-info">
            <h4 id="partnerName">—</h4>
            <span id="partnerOnlineStatus" style="font-size:12px;color:#64748b;">Ngoại tuyến</span>
          </div>
        </div>
      </div>

      <div class="messages-body" id="messagesBody"></div>

      <div class="typing-indicator" id="typingIndicator" style="display:none;"></div>

      <div class="chat-input-area">
        <input class="chat-input" id="messageInput" placeholder="Nhập tin nhắn…" autocomplete="off" />
        <button class="send-btn" id="sendBtn" title="Gửi">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </div>
  </main>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
